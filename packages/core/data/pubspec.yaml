description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  path_provider: ^2.1.6
  web: ^1.1.1
  geolocator: ^14.1.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.2
  sqflite: ^2.4.6
  domain:
    path: ../domain
  shared_preferences: ^2.5.3
  cloud_firestore: ^7.1.0
  collection: ^1.19.1
  firebase_auth: ^7.0.1
  network:
    path: ../network
  image: ^4.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

